<!doctype html>
<!-- PROTOTYPE, throwaway: a harmless signup form with a bot-check wall, for issue #21. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up · {{PRODUCT}}</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; max-width: 420px; margin: 24px auto; padding: 0 12px; color: #222; }
  h1 { font-size: 20px; }
  label { display: block; margin-top: 12px; font-size: 13px; color: #555; }
  input[type=text], input[type=email], input[type=password] { width: 100%; box-sizing: border-box; padding: 6px; font-size: 14px; }
  .error { background: #fde8e8; color: #9b1c1c; padding: 8px; margin: 12px 0; }
  .small { font-size: 11px; color: #777; }
  button { margin-top: 14px; font-size: 13px; padding: 4px 10px; }
</style>
</head>
<body>
<h1>Create your {{PRODUCT}} account</h1>
{{ERROR}}
<form method="post" action="/submit/{{ID}}">
  <label>Full name <input type="text" name="name" value="{{NAME}}" required></label>
  <label>Email <input type="email" name="email" value="{{EMAIL}}" required></label>
  <label>Password <input type="password" name="password" required minlength="12"></label>
  <label>Verification code <span class="small">(we emailed you a 6-digit code)</span>
    <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" required pattern="[0-9]{6}"></label>
  <label class="small"><input type="checkbox" name="terms" required> I agree to the <a href="/terms" target="_blank">Terms</a></label>
  <div style="margin-top:12px" class="cf-turnstile" data-sitekey="3x00000000000000000000FF"></div>
  <button type="submit">Create account</button>
</form>
<p class="small">Test form on the prototype rig. Nothing is created anywhere.</p>
</body>
</html>
